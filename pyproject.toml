[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "lightapi"
version = "0.1.27"
description = "A lightweight framework for building API endpoints using Python's native libraries."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "iklobato", email = "iklobato1@gmail.com" },
]
keywords = [
    "api",
    "rest",
    "restful",
    "endpoint",
    "lightweight",
    "framework",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "SQLAlchemy>=2.0.30,<3.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "pydantic>=2.0,<3.0",
    "starlette>=0.37.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "redis>=5.0.0,<6.0.0",
    "PyYAML>=6.0,<7.0",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
async = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "aiosqlite>=0.20,<1.0",
    "greenlet>=3.0,<4.0",
]
dev = [
    "pytest>=7.3.1,<9.0.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "aiosqlite>=0.20,<1.0",
    "ruff>=0.4.0",
    "mypy>=1.3.0,<2.0.0",
]
test = [
    "pytest>=7.3.1,<9.0.0",
    "pytest-cov>=4.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-glightbox",
    "mkdocs-awesome-pages-plugin",
    "mkdocs-git-committers-plugin-2",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-git-authors-plugin",
]

[project.scripts]
lightapi = "lightapi.server:main"

[project.urls]
Repository = "https://github.com/henriqueblobato/LightApi"
Issues = "https://github.com/henriqueblobato/LightApi/issues"
Homepage = "https://github.com/henriqueblobato/LightApi"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = "test_*.py"
asyncio_mode = "auto"
xfail_strict = true
markers = [
    "integration: needs a real Postgres/Redis, skipped unless LIGHTAPI_TEST_PG_SYNC etc. are set",
]
# Any warning the library or the tests raise fails the run; a warning a test
# expects goes through pytest.warns(). ResourceWarning keeps Python's default
# (ignored): the tests build throwaway engines they never dispose().
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "BLE", "S", "TRY", "SIM", "ASYNC", "DTZ", "PTH",
    "T20", "G", "LOG", "ARG", "ERA", "RUF", "UP", "C4", "PERF", "RET", "SLF",
    "PGH", "ANN401", "C901",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, reach into the objects they test, take fixtures they do not
# use, spell credentials out, and keep long one-line assertions.
"tests/**/*.py" = ["S101", "SLF001", "ARG", "ANN401", "S105", "S106", "S107", "E501"]
# Examples bind every interface, print, assert as smoke checks, show demo
# credentials, write `type(self)._model_class` the way the docs teach, keep the
# documented `queryset(self, request)` signature, and quote curl commands.
"examples/*.py" = ["S104", "T20", "S101", "S105", "SLF001", "ARG002", "E501"]
# The e2e apps are user code too: `type(self)._model_class` in a queryset and the
# documented `queryset(self, request)` / `process(self, request, response)` signatures.
"tools/e2e/apps/*.py" = ["SLF001", "ARG002", "T20"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = [
    "tests/test_caching_example.py",
    "tests/test_custom_snippet.py",
    "tests/test_filtering_pagination_example.py",
]

[[tool.mypy.overrides]]
module = [
    "jwt.*",
    "redis.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# redis-py types every reply of its sync client as "Awaitable | Any" (ResponseT),
# so get/set/ping can never type-check here; RedisCache is FROZEN and takes no
# narrowing casts. Every other module is checked.
module = ["lightapi.cache"]
ignore_errors = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=0.26.0",
]
